<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeira Tabela</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: rgb(187, 187, 187);
    }
    table{
        border-collapse: collapse;
        width: 400px;
        height: 400px;
        
    }
    td{
        border: 1px solid rgb(0, 0, 0);
        padding: 10px;
        text-align: center;
        vertical-align: top;

    }
    .A1{
       color: brown;
    }

    .numero{
        text-align: right;

    }
</style>
<body>
    <h1>minha primeira Tabela</h1>

    <table>
        <tr>
            <td class="A1">A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td class="numero">C2</td>
        </tr>
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td class="numero">C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td>B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
