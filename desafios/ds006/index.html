<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tags HTML</title>
</head>
<body>
    <H1>Tags HTML</H1>
    <p>em <strong>HTML 5</strong>, podemos inserir as seguintes tags abaixo, passe o mouse em cima para descobrir qual o significados de cada uma.</p>
    <ul>
        <li><abbr title="p> /p>">parágrafos</abbr></li>
        <li><abbr title="abbr> /abbr>">abreviações</abbr></li>
        <li><abbr title="ul> li>">listas nao ordenadas</abbr></li>
        <li><abbr title="ol> li>">listas ordenadas</abbr></li>
        <li><abbr title="h1> h6>">titulos</abbr></li>
        <li><abbr title="img>">imagens</abbr></li>
        <li><abbr title="dl> dt> -> termo dd> -> descrição ">lista de definição</abbr></li>
        <li><abbr title="code>">codigo-fonte</abbr></li>
        
    </ul>

    
</body>
</html>
