<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio tabelas</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }
    h1{
        text-align: center;
    }
    table{
        border-collapse: collapse;
    }
    th,td{
        border: 1px solid black;
        padding: 10px;
    }
    .media{
        background-color: rgb(131, 131, 131);
    }
</style>
<body>
        <h1>desafio tabela</h1>
        <table>
            <thead class="media">
                <tr>
                    <th rowspan="2" scope="colgroup">Áreas</th>
                    <th rowspan="2" scope="colgroup">Disciplinas</th>
                    <th colspan="2" scope="colgroup">Notas</th>
                    <th rowspan="2" scope="colgroup">Media</th>
                    

                </tr>
                <tr>
                    <th scope="col">nota 1</th>
                    <th scope="col">nota 2</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th rowspan="5" scope="rowgroup">Exatas</th>
                </tr>
                <tr>
                    <td>matematica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>fisica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>quimica</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr>
                    <td>biologia</td>
                    <td>0.0</td>
                    <td>0.0</td>
                    <td>0.0</td>
                </tr>
                <tr class="media">
                    <td colspan="4" >Media de exatas</td>
                    <td >00.0</td>
                </tr>
                <tr>
                    <th rowspan="3" scope="rowgroup">Humanas</th>
                </tr>
                <tr>
                    <td>historia</td>
                    <td>00.0</td>
                    <td>00.0</td>
                    <td>00.0</td>
                </tr>
                <tr>
                    <td>geografia</td>
                    <td>00.0</td>
                    <td>00.0</td>
                    <td>00.0</td>
                </tr>
                <tr class="media">
                    <td colspan="4" >media de humanas</td>
                    <td >0.0</td>
                </tr>
            </tbody>
        </table>
</body>
</html>
