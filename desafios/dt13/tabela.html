<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio tabelas</title>
</head>
<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }
    h1 a{
        text-decoration: none;
        
    }
    h1 a:hover{
        text-decoration: underline;
        background-color: rgba(179, 179, 255, 0.089);
        border-radius: 10px;
    }
    table{
        border-collapse: collapse;
      
    }

    tr td{
        border: 1px solid black;
        padding: 25px;
        
    }
</style>
<body>
    <h1>Este é o desafio 13 parte 01 do <a href="https://www.cursoemvideo.com/curso/curso-html5-e-css3-modulo-3-de-5-40-horas/aulas/modulo-03/modulos/capitulo-21-aula-09-desafios-parte-1-2/" target="_blank" >curso em video</a> </h1>
    <table>
        <thead>
            <tr id="umaquatro">
                <td>1</td>
                <td>2</td>
                <td rowspan="2"
                colspan="2">3</td>
                <td>4</td>

            </tr>
            <tr>
                <td >5</td>
                <td>6</td>
                <td>7</td>
            </tr>
            <tr>
                <td colspan="4">8</td>
                <td>9</td>
            </tr>
            <tr>
                <td rowspan="2" colspan="2">10</td>
                <td colspan="2">11</td>
                <td>12</td>
            </tr>
            <tr>
                <td>13</td>
                <td>14</td>
                <td>15</td>
            </tr>
        </thead>
    </table>
</body>
</html>
